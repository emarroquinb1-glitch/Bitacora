<!DOCTYPE html>
<html lang="es">

<head>

    <!-- CONFIGURACIÓN BÁSICA -->
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="Una bitácora personal para registrar tus pendientes diarios."
    >


    <!-- CONFIGURACIÓN PARA iPHONE / iOS -->

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Bitácora"
    >

    <link
        rel="apple-touch-icon"
        href="./icons/icon-192.png"
    >


    <title>Bitácora</title>


    <!-- PWA -->

    <link
        rel="manifest"
        href="./manifest.json"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- ========================================
         ENCABEZADO
    ======================================== -->

    <header class="header">

        <div class="header-top">

            <div>

                <h1>
                    Bitácora
                </h1>

                <p id="currentDate"></p>

            </div>


            <!-- BOTÓN + -->

            <button
                id="addButton"
                class="add-button"
                aria-label="Crear nuevo pendiente"
                title="Nuevo pendiente"
            >

                <svg
                    viewBox="0 0 24 24"
                    width="24"
                    height="24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    aria-hidden="true"
                >

                    <path d="M12 5v14"/>

                    <path d="M5 12h14"/>

                </svg>

            </button>

        </div>


        <!-- ========================================
             BUSCADOR Y FILTROS
        ======================================== -->

        <div class="filters-area">


            <!-- BUSCADOR -->

            <div class="search-box">

                <svg
                    class="search-icon"
                    viewBox="0 0 24 24"
                    width="19"
                    height="19"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                    />

                    <path d="m20 20-4-4"/>

                </svg>


                <input
                    type="search"
                    id="searchInput"
                    placeholder="Buscar tarea"
                    autocomplete="off"
                    aria-label="Buscar tarea"
                >

            </div>


            <!-- FILTRO DE ESTADO -->

            <div class="filter-box">

                <svg
                    class="filter-icon"
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <path d="M4 6h16"/>

                    <path d="M7 12h10"/>

                    <path d="M10 18h4"/>

                </svg>


                <select
                    id="statusFilter"
                    aria-label="Filtrar por estado"
                >

                    <option value="all">
                        Todas
                    </option>

                    <option value="pending">
                        Pendientes
                    </option>

                    <option value="completed">
                        Completadas
                    </option>

                </select>

            </div>


            <!-- FILTRO DE FECHA -->

            <div
                class="date-filter-box"
                id="dateFilterBox"
            >

                <svg
                    class="calendar-icon"
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <rect
                        x="3"
                        y="4"
                        width="18"
                        height="18"
                        rx="3"
                    />

                    <path d="M16 2v4"/>

                    <path d="M8 2v4"/>

                    <path d="M3 10h18"/>

                </svg>


                <input
                    type="date"
                    id="dateFilter"
                    aria-label="Filtrar por fecha"
                >


                <button
                    id="clearDateButton"
                    class="clear-date-button hidden"
                    type="button"
                    aria-label="Mostrar todas las fechas"
                    title="Mostrar todas las fechas"
                >

                    <svg
                        viewBox="0 0 24 24"
                        width="16"
                        height="16"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        aria-hidden="true"
                    >

                        <path d="M6 6l12 12"/>

                        <path d="M18 6L6 18"/>

                    </svg>

                </button>

            </div>

        </div>

    </header>


    <!-- ========================================
         CONTENIDO
    ======================================== -->

    <main class="container">

        <div
            id="taskList"
            class="task-list"
        >

            <!-- Las tareas se generan mediante JavaScript -->

        </div>

    </main>


    <!-- ========================================
         MODAL CREAR / EDITAR
    ======================================== -->

    <div
        id="taskModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <h2>
                Nuevo pendiente
            </h2>


            <!-- ====================================
                 TEXTO DE LA TAREA
            ==================================== -->

            <textarea
                id="taskInput"
                class="task-input"
                placeholder="¿Qué necesitas recordar?"
                autocomplete="off"
                rows="4"
            ></textarea>


            <!-- ====================================
                 FECHA DE LA TAREA
            ==================================== -->

            <div class="task-date-section">

                <label
                    for="taskDate"
                    class="task-date-label"
                >
                    ¿Para qué día?
                </label>


                <select
                    id="taskDate"
                    class="task-date-select"
                >

                    <option value="today">
                        Hoy
                    </option>

                    <option value="tomorrow">
                        Mañana
                    </option>

                    <option value="yesterday">
                        Ayer
                    </option>

                    <option value="custom">
                        Elegir fecha
                    </option>

                </select>


                <!-- FECHA PERSONALIZADA -->

                <div
                    id="customDateContainer"
                    class="custom-date-container hidden"
                >

                    <label
                        for="customTaskDate"
                        class="custom-date-label"
                    >
                        Selecciona el día
                    </label>


                    <input
                        type="date"
                        id="customTaskDate"
                        class="custom-task-date"
                    >

                </div>

            </div>


            <!-- ====================================
                 BOTONES
            ==================================== -->

            <div class="modal-buttons">

                <button
                    id="cancelButton"
                    type="button"
                >
                    Cancelar
                </button>


                <button
                    id="saveButton"
                    type="button"
                >
                    Guardar
                </button>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="./app.js"></script>

</body>

</html>
